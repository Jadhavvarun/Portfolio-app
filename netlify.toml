[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  NEXT_PUBLIC_USE_FIREBASE_EMULATOR = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://varun-jadhav.netlify.app/*"
  to = "https://varunjadhav.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://varun-jadhav.netlify.app/*"
  to = "https://varunjadhav.in/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"