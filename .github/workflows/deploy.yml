name: Automated Production Deployment to Netlify

on:
  push:
    branches:
      - main

# Prevent redundant concurrent builds on rapid commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and Deploy to Netlify
        run: |
          npx --yes netlify-cli deploy \
            --build \
            --prod \
            --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            --site="${{ secrets.NETLIFY_SITE_ID || 'b17eb069-9e2c-4b97-81d8-e78422cb682d' }}" \
            --message="Deploy from GitHub Actions ${{ github.sha }}"
        env:
          CI: "true"
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || 'b17eb069-9e2c-4b97-81d8-e78422cb682d' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyCYKlK3AO2UBgPSPnCeE8nZCDsl0_y9tG4' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'varun-portfolio-f7909.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'varun-portfolio-f7909' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'varun-portfolio-f7909.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '12600215732' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:12600215732:web:7dcb2f7787ad2e1cd9afe1' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-S7QY13F39R' }}
          NEXT_PUBLIC_ADMIN_EMAILS: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAILS || 'jadhavvarun67@gmail.com' }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"

